<!DOCTYPE html>
<html lang="uz" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Professional Video Player</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <style>
      /* Orqaga qaytish tugmasi uchun qo'shimcha dizayn */
      body {
        margin: 0;
        background: #000;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(5px);
      }
      /* Konteynerni ekranga moslash */
      .container {
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        border-radius: 0 !important;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>

    <button class="back-btn" onclick="history.back()">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="container show-controls">
        <div class="wrapper">
            <div class="video-timeline">
                <div class="progress-area">
                    <span>00:00</span>
                    <div class="progress-bar"></div>
                </div>
            </div>
            <ul class="video-controls">
                <li class="options left">
                    <button class="volume"><i class="fa-solid fa-volume-high"></i></button>
                    <input type="range" min="0" max="1" step="any">
                    <div class="video-timer">
                        <p class="current-time">00:00</p>
                        <p class="separator"> / </p>
                        <p class="video-duration">00:00</p>
                    </div>
                </li>
                <li class="options center">
                    <button class="skip-backward"><i class="fas fa-backward"></i></button>
                    <button class="play-pause"><i class="fas fa-play"></i></button>
                    <button class="skip-forward"><i class="fas fa-forward"></i></button>
                </li>
                <li class="options right">
                    <div class="playback-content">
                        <button class="playback-speed"><span class="material-symbols-rounded">slow_motion_video</span></button>
                        <ul class="speed-options">
                            <li data-speed="2">2x</li>
                            <li data-speed="1.5">1.5x</li>
                            <li data-speed="1" class="active">Normal</li>
                            <li data-speed="0.75">0.75x</li>
                            <li data-speed="0.5">0.5x</li>
                        </ul>
                    </div>
                    <button class="pic-in-pic"><span class="material-icons">picture_in_picture_alt</span></button>
                    <button class="fullscreen"><i class="fa-solid fa-expand"></i></button>
                </li>
            </ul>
        </div>
        <video id="main-video" src="" poster=""></video>
    </div>

    <script>
const urlParams = new URLSearchParams(window.location.search);
const videoUrl = urlParams.get('url');
const posterUrl = urlParams.get('poster');

const video = document.getElementById('main-video');

if (videoUrl) {
    video.src = decodeURIComponent(videoUrl);
    if (posterUrl) {
        video.setAttribute('poster', decodeURIComponent(posterUrl));
    }
} else {
    alert("Video linki topilmadi!");
}

// 🔥 AUTOPLAY
video.muted = true;
video.play();

// 🔥 FULLSCREEN + LANDSCAPE
video.addEventListener("play", async () => {
    try {
        if (video.requestFullscreen) {
            await video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
            await video.webkitRequestFullscreen();
        }

        if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock("landscape");
        }
    } catch (err) {
        console.log(err);
    }
});

// 🔙 FULLSCREENdan chiqsa tiklash
document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
        if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
        }
    }
});


// ==========================
// 🔥 DOUBLE TAP SEEK
// ==========================
let lastTap = 0;

video.addEventListener("touchend", (e) => {
    let currentTime = new Date().getTime();
    let tapLength = currentTime - lastTap;

    if (tapLength < 300 && tapLength > 0) {
        let x = e.changedTouches[0].clientX;
        let screenWidth = window.innerWidth;

        if (x < screenWidth / 2) {
            // ⏪ orqaga 10s
            video.currentTime -= 10;
        } else {
            // ⏩ oldinga 10s
            video.currentTime += 10;
        }
    }
    lastTap = currentTime;
});


// ==========================
// 🔥 SWIPE CONTROL (volume + brightness)
// ==========================
let startY = 0;
let startX = 0;

video.addEventListener("touchstart", (e) => {
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
});

video.addEventListener("touchmove", (e) => {
    let currentY = e.touches[0].clientY;
    let currentX = e.touches[0].clientX;

    let diffY = startY - currentY;
    let screenWidth = window.innerWidth;

    if (startX > screenWidth / 2) {
        // 🔊 VOLUME (o‘ng taraf)
        let newVolume = video.volume + diffY / 500;
        video.volume = Math.max(0, Math.min(1, newVolume));
    } else {
        // 💡 BRIGHTNESS (chap taraf)
        let brightness = 1 + diffY / 500;
        brightness = Math.max(0.3, Math.min(2, brightness));
        video.style.filter = `brightness(${brightness})`;
    }
});
</script>

    <script src="script.js"></script>

  </body>
</html>
